<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d">
  <title id="t">UAS attack surface and trust boundaries</title>
  <desc id="d">Cloud API, ground control station, datalink, and an air vehicle containing a companion computer and flight controller, separated by trust boundaries, with the supply chain as a band behind all of them. A signed command passes the radio boundary check; an unauthenticated frame is rejected there.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .node { fill: #FFFFFF; stroke: #DAD6CC; stroke-width: 1.5; }
    .hotnode { fill: #FFFFFF; stroke: #A33A2B; stroke-width: 2; animation: hot 4s ease-in-out infinite; }
    @keyframes hot { 0%, 100% { stroke-opacity: .45; } 50% { stroke-opacity: 1; } }
    .tb { stroke: #5B7083; stroke-width: 1.5; stroke-dasharray: 7 6; fill: none; }
    .flow { fill: none; stroke: #1F3A5F; stroke-width: 1.75; stroke-dasharray: 5 6; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    .good { animation: good 8s linear infinite; }
    @keyframes good { 0% { transform: translateY(0); opacity: 1; } 40% { transform: translateY(170px); opacity: 1; } 46%, 100% { transform: translateY(170px); opacity: 0; } }
    .okmark { opacity: 0; animation: okm 8s linear infinite; }
    @keyframes okm { 0%, 12% { opacity: 0; } 16%, 40% { opacity: 1; } 46%, 100% { opacity: 0; } }
    .bad { opacity: 0; animation: bad 8s linear infinite; }
    @keyframes bad { 0%, 50% { transform: translateX(0); opacity: 0; } 51% { opacity: 1; } 70% { transform: translateX(112px); opacity: 1; } 76%, 100% { transform: translateX(112px); opacity: 0; } }
    .nomark { opacity: 0; animation: nom 8s linear infinite; }
    @keyframes nom { 0%, 68% { opacity: 0; } 71%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .good, .bad { opacity: 0; } .okmark, .nomark { opacity: 1; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A8088"/></marker>
  </defs>
  <rect width="1000" height="640" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="999" height="639" fill="none" stroke="#DAD6CC"/>
  <rect x="0" y="0" width="1000" height="3" fill="#1F3A5F"/>
  <text x="40" y="38" class="mono" font-size="12" letter-spacing="1.2" fill="#7A8088">FIGURE 1 · REFERENCE ARCHITECTURE · NOT A SPECIFIC PRODUCT</text>
  <text x="40" y="64" class="serif" font-size="22" font-weight="600" fill="#1B1F24">Attack surface and trust boundaries of a small UAS</text>

  <!-- supply chain band -->
  <rect x="872" y="92" width="92" height="498" rx="6" fill="#EDF0F3" stroke="#DAD6CC"/>
  <text transform="translate(924 340) rotate(-90)" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#1B1F24">SC · Supply chain and update path</text>
  <text transform="translate(944 340) rotate(-90)" text-anchor="middle" class="mono" font-size="11" fill="#4A5058">components · builds · signing keys · updates</text>
  <path d="M872 130 H652" fill="none" stroke="#7A8088" stroke-width="1.25" stroke-dasharray="3 4" marker-end="url(#as)"/>
  <path d="M872 250 H652" fill="none" stroke="#7A8088" stroke-width="1.25" stroke-dasharray="3 4" marker-end="url(#as)"/>
  <path d="M872 520 H822" fill="none" stroke="#7A8088" stroke-width="1.25" stroke-dasharray="3 4" marker-end="url(#as)"/>
  <text x="760" y="124" text-anchor="middle" class="mono" font-size="11" fill="#7A8088">signed images</text>

  <!-- cloud -->
  <rect class="node" x="320" y="96" width="330" height="64" rx="4"/>
  <text x="336" y="122" class="sans" font-size="15" font-weight="600" fill="#1B1F24">API · Cloud and fleet API</text>
  <text x="336" y="144" class="sans" font-size="12.5" fill="#4A5058">tokens, fleet data, tasking, updates</text>

  <line class="tb" x1="40" y1="186" x2="850" y2="186"/>
  <text x="40" y="180" class="mono" font-size="11" fill="#5B7083">TB-CLOUD · organisation / service and other tenants</text>

  <!-- ground -->
  <rect class="hotnode" x="320" y="214" width="330" height="72" rx="4"/>
  <text x="336" y="240" class="sans" font-size="15" font-weight="600" fill="#1B1F24">GCS · Ground control station</text>
  <text x="336" y="262" class="sans" font-size="12.5" fill="#4A5058">keys, plans, live picture: usually the softest target</text>
  <path class="flow" d="M430 163 V210" marker-end="url(#a)"/>
  <path class="flow" d="M540 211 V164" marker-end="url(#a)"/>
  <rect x="100" y="222" width="170" height="56" rx="4" fill="none" stroke="#5B7083" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="185" y="245" text-anchor="middle" class="mono" font-size="11" fill="#5B7083">TB-GROUND</text>
  <text x="185" y="264" text-anchor="middle" class="sans" font-size="12" fill="#4A5058">enterprise network, internet</text>
  <line x1="270" y1="250" x2="320" y2="250" stroke="#7A8088" stroke-width="1.25"/>

  <line class="tb" x1="40" y1="314" x2="850" y2="314"/>
  <text x="40" y="308" class="mono" font-size="11" fill="#5B7083">TB-RF · anyone in radio range can transmit</text>

  <!-- datalink -->
  <rect class="hotnode" x="360" y="334" width="250" height="60" rx="4"/>
  <text x="376" y="358" class="sans" font-size="15" font-weight="600" fill="#1B1F24">DL · Datalink</text>
  <text x="376" y="379" class="sans" font-size="12.5" fill="#4A5058">commands up, telemetry and video down</text>
  <line x1="485" y1="286" x2="485" y2="334" stroke="#1F3A5F" stroke-width="1.75"/>
  <line x1="485" y1="394" x2="485" y2="456" stroke="#1F3A5F" stroke-width="1.75"/>

  <!-- unauthenticated transmitter -->
  <rect x="60" y="340" width="190" height="48" rx="4" fill="#F6E9E6" stroke="#A33A2B" stroke-width="1.5"/>
  <text x="155" y="360" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#1B1F24">Unauthenticated sender</text>
  <text x="155" y="378" text-anchor="middle" class="mono" font-size="11" fill="#4A5058">no key</text>
  <line x1="250" y1="364" x2="356" y2="364" stroke="#A33A2B" stroke-width="1.25" stroke-dasharray="3 4"/>

  <!-- air vehicle -->
  <rect x="80" y="424" width="760" height="166" rx="8" fill="#F6F4EF" stroke="#DAD6CC" stroke-width="1.5"/>
  <text x="96" y="446" class="sans" font-size="13" font-weight="600" fill="#1B1F24">AV · Air vehicle</text>
  <rect class="node" x="110" y="470" width="220" height="76" rx="4"/>
  <text x="126" y="496" class="sans" font-size="15" font-weight="600" fill="#1B1F24">CC · Companion computer</text>
  <text x="126" y="517" class="sans" font-size="12.5" fill="#4A5058">autonomy, perception, payload</text>
  <text x="126" y="535" class="sans" font-size="12.5" fill="#4A5058">large, updatable software</text>
  <line class="tb" x1="360" y1="456" x2="360" y2="580"/>
  <text x="366" y="576" class="mono" font-size="11" fill="#5B7083">TB-ONBOARD</text>
  <line x1="330" y1="508" x2="396" y2="508" stroke="#1F3A5F" stroke-width="1.75" marker-end="url(#a)"/>
  <rect x="352" y="498" width="16" height="20" rx="2" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="363" y="490" text-anchor="middle" class="mono" font-size="10.5" fill="#1F3A5F">allow-list</text>
  <rect class="node" x="400" y="456" width="240" height="90" rx="4" stroke="#1F3A5F"/>
  <text x="416" y="482" class="sans" font-size="15" font-weight="600" fill="#1B1F24">Flight controller</text>
  <text x="416" y="503" class="sans" font-size="12.5" fill="#4A5058">verifies signature, freshness</text>
  <text x="416" y="521" class="sans" font-size="12.5" fill="#4A5058">and command authorisation</text>
  <rect class="node" x="664" y="470" width="150" height="76" rx="4"/>
  <text x="680" y="496" class="sans" font-size="14" font-weight="600" fill="#1B1F24">Nav sources</text>
  <text x="680" y="517" class="sans" font-size="12.5" fill="#4A5058">GNSS, IMU, vision</text>
  <text x="680" y="535" class="sans" font-size="12.5" fill="#4A5058">cross-checked</text>
  <line x1="664" y1="508" x2="644" y2="508" stroke="#1F3A5F" stroke-width="1.75" marker-end="url(#a)"/>

  <!-- signed command travelling GCS -> FC, checked at TB-RF -->
  <g class="good"><rect x="473" y="280" width="24" height="16" rx="3" fill="#5E7F68"/><text x="485" y="292" text-anchor="middle" class="mono" font-size="9" fill="#FFFFFF">sig</text></g>
  <g class="okmark"><circle cx="520" cy="314" r="11" fill="#EAF0EB" stroke="#5E7F68" stroke-width="1.5"/><path d="M514 314 l4 4 l8 -8" fill="none" stroke="#5E7F68" stroke-width="2"/>
    <text x="538" y="309" class="mono" font-size="11" fill="#5E7F68">signed, fresh: accepted</text></g>
  <!-- unauthenticated frame rejected -->
  <g class="bad"><rect x="232" y="356" width="24" height="16" rx="3" fill="#A33A2B"/></g>
  <g class="nomark"><circle cx="350" cy="364" r="11" fill="#F6E9E6" stroke="#A33A2B" stroke-width="1.5"/><path d="M345 359 l10 10 m0 -10 l-10 10" stroke="#A33A2B" stroke-width="2"/>
    <text x="150" y="410" text-anchor="middle" class="mono" font-size="11" fill="#A33A2B">no valid tag: rejected</text></g>

  <!-- legend -->
  <g class="sans" font-size="12" fill="#4A5058">
    <rect x="40" y="606" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#A33A2B" stroke-width="2"/><text x="70" y="617">most frequently attacked</text>
    <line x1="240" y1="613" x2="272" y2="613" class="tb"/><text x="280" y="617">trust boundary</text>
    <rect x="400" y="606" width="22" height="14" rx="3" fill="#5E7F68"/><text x="430" y="617">authenticated command</text>
    <rect x="600" y="606" width="22" height="14" rx="3" fill="#EDF0F3" stroke="#DAD6CC"/><text x="630" y="617">cross-cutting boundary</text>
  </g>
</svg>
