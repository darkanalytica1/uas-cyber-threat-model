<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="t d">
  <title id="t">MAVLink 2 signed packet structure</title>
  <desc id="d">A signed MAVLink 2 packet: 10-byte header, payload, 2-byte CRC, then a 13-byte signature block of link ID, 48-bit timestamp and 48-bit signature. The signature is the first 48 bits of SHA-256 over the secret key, header, payload, CRC, link ID and timestamp. The receiver checks the signature, that the timestamp is newer than the last for the stream, and that it is within one minute of local time.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .hashed { animation: sweep 8s linear infinite; }
    .h1 { animation-delay: 0s; } .h2 { animation-delay: .35s; } .h3 { animation-delay: .7s; } .h4 { animation-delay: 1.05s; } .h5 { animation-delay: 1.4s; } .h6 { animation-delay: 1.75s; }
    @keyframes sweep { 0% { stroke: #DAD6CC; stroke-width: 1.5; } 4%, 30% { stroke: #1F3A5F; stroke-width: 2.5; } 38%, 100% { stroke: #DAD6CC; stroke-width: 1.5; } }
    .sig { animation: sig 8s ease-in-out infinite; }
    @keyframes sig { 0%, 34% { stroke: #5E7F68; stroke-width: 1.5; } 40%, 58% { stroke: #5E7F68; stroke-width: 3.5; } 66%, 100% { stroke: #5E7F68; stroke-width: 1.5; } }
    .flow { fill: none; stroke: #1F3A5F; stroke-width: 1.75; stroke-dasharray: 5 6; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    .chk { opacity: .35; animation: chk 8s linear infinite; }
    .c1 { animation-delay: 4.8s; } .c2 { animation-delay: 5.6s; } .c3 { animation-delay: 6.4s; }
    @keyframes chk { 0% { opacity: 1; } 22% { opacity: 1; } 30%, 100% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .chk { opacity: 1; } }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker></defs>
  <rect width="1000" height="440" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="999" height="439" fill="none" stroke="#DAD6CC"/>
  <rect x="0" y="0" width="1000" height="3" fill="#1F3A5F"/>
  <text x="40" y="38" class="mono" font-size="12" letter-spacing="1.2" fill="#7A8088">FIGURE 2 · FROM THE PUBLIC MAVLINK 2 SIGNING SPECIFICATION · 9-BYTE PAYLOAD SHOWN</text>
  <text x="40" y="64" class="serif" font-size="22" font-weight="600" fill="#1B1F24">A signed MAVLink 2 packet: what the 13 extra bytes protect</text>

  <!-- byte ruler: 26 px per byte, 34 bytes, x = 58 .. 942 -->
  <g class="mono" font-size="11" fill="#7A8088" text-anchor="middle">
    <text x="188" y="98">10 bytes</text><text x="435" y="98">9 bytes</text><text x="578" y="98">2</text><text x="630" y="98">1</text><text x="721" y="98">6 bytes</text><text x="877" y="98">6 bytes</text>
  </g>
  <rect class="hashed h1" x="58" y="106" width="260" height="56" fill="#EDF0F3"/>
  <rect class="hashed h2" x="318" y="106" width="234" height="56" fill="#FFFFFF"/>
  <rect class="hashed h3" x="552" y="106" width="52" height="56" fill="#F6EFDF"/>
  <rect class="hashed h4" x="604" y="106" width="52" height="56" fill="#E8EDF3"/>
  <rect class="hashed h5" x="656" y="106" width="130" height="56" fill="#E8EDF3"/>
  <rect class="sig" x="786" y="106" width="156" height="56" fill="#EAF0EB"/>
  <g class="sans" font-size="13" fill="#1B1F24" text-anchor="middle">
    <text x="188" y="131">Header</text><text x="435" y="131">Payload</text><text x="578" y="131">CRC</text><text x="630" y="131">Link</text><text x="721" y="131">Timestamp</text><text x="864" y="131">Signature</text>
  </g>
  <g class="mono" font-size="10.5" fill="#4A5058" text-anchor="middle">
    <text x="188" y="150">flags 0x01 = signed</text><text x="435" y="150">message fields</text><text x="578" y="150">X.25</text><text x="630" y="150">ID</text><text x="721" y="150">10 µs since 2015</text><text x="864" y="150">48 bits</text>
  </g>
  <path d="M552 172 h52" stroke="#B8872B" stroke-width="1.5"/>
  <text x="578" y="188" text-anchor="middle" class="sans" font-size="11.5" fill="#8A6420">detects corruption,</text>
  <text x="578" y="202" text-anchor="middle" class="sans" font-size="11.5" fill="#8A6420">authenticates nothing</text>
  <path d="M604 172 v6 h338 v-6" fill="none" stroke="#7A8088" stroke-width="1.25"/>
  <text x="773" y="196" text-anchor="middle" class="mono" font-size="11" fill="#4A5058">signature block, 13 bytes</text>

  <!-- computation -->
  <text x="40" y="244" class="mono" font-size="11" letter-spacing="1" fill="#7A8088">SENDER</text>
  <rect x="58" y="256" width="190" height="54" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="153" y="279" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#1B1F24">Secret key</text>
  <text x="153" y="297" text-anchor="middle" class="mono" font-size="11" fill="#4A5058">32 bytes, never sent</text>
  <rect x="300" y="256" width="310" height="54" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
  <text x="455" y="279" text-anchor="middle" class="mono" font-size="12" fill="#1B1F24">SHA-256(key ‖ header ‖ payload</text>
  <text x="455" y="297" text-anchor="middle" class="mono" font-size="12" fill="#1B1F24">‖ CRC ‖ link ‖ timestamp)</text>
  <rect x="662" y="256" width="160" height="54" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
  <text x="742" y="279" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#1B1F24">First 6 bytes</text>
  <text x="742" y="297" text-anchor="middle" class="mono" font-size="11" fill="#4A5058">256 → 48 bits</text>
  <path class="flow" d="M248 283 H296" marker-end="url(#a)"/>
  <path class="flow" d="M610 283 H658" marker-end="url(#a)"/>
  <path class="flow" d="M822 283 H864 V166" marker-end="url(#a)"/>
  <path class="flow" d="M455 206 V252" marker-end="url(#a)"/>

  <!-- receiver checks -->
  <line x1="40" y1="330" x2="960" y2="330" stroke="#ECE8E0"/>
  <text x="40" y="354" class="mono" font-size="11" letter-spacing="1" fill="#7A8088">RECEIVER ACCEPTS ONLY IF ALL THREE HOLD</text>
  <g class="chk c1">
    <rect x="58" y="366" width="280" height="52" rx="4" fill="#EAF0EB" stroke="#5E7F68" stroke-width="1.5"/>
    <text x="74" y="388" class="sans" font-size="13" font-weight="600" fill="#1B1F24">1 · Signature recomputes</text>
    <text x="74" y="406" class="sans" font-size="12" fill="#4A5058">authenticity and integrity</text>
  </g>
  <g class="chk c2">
    <rect x="360" y="366" width="280" height="52" rx="4" fill="#EAF0EB" stroke="#5E7F68" stroke-width="1.5"/>
    <text x="376" y="388" class="sans" font-size="13" font-weight="600" fill="#1B1F24">2 · Newer than last for stream</text>
    <text x="376" y="406" class="mono" font-size="11.5" fill="#4A5058">(system, component, link)</text>
  </g>
  <g class="chk c3">
    <rect x="662" y="366" width="280" height="52" rx="4" fill="#EAF0EB" stroke="#5E7F68" stroke-width="1.5"/>
    <text x="678" y="388" class="sans" font-size="13" font-weight="600" fill="#1B1F24">3 · Within 1 min of local clock</text>
    <text x="678" y="406" class="sans" font-size="12" fill="#4A5058">bounded staleness</text>
  </g>
</svg>
