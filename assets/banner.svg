  <text x="64" y="222" class="sans" font-size="19" fill="#3D4A5C">STRIDE across six trust boundaries, each threat paired with</text>
  <text x="64" y="250" class="sans" font-size="19" fill="#3D4A5C">the control that counters it. Defensive and educational.</text>
