<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">UAS Cyber Threat Model</title>
  <desc id="d">Banner: a six by six grid of attack surfaces against STRIDE categories filling in cell by cell, showing that every cell is considered.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .cell { fill: #FFFFFF; stroke: #D8DEE6; stroke-width: 1.5; animation: fill 8s ease-in-out infinite; }
    @keyframes fill { 0% { fill: #FFFFFF; stroke: #D8DEE6; } 8% { fill: #EDF1F6; stroke: #0B2545; } 70% { fill: #EDF1F6; stroke: #0B2545; } 85%, 100% { fill: #FFFFFF; stroke: #D8DEE6; } }
    .hot { animation: hot 8s ease-in-out infinite; }
    @keyframes hot { 0%, 45% { opacity: 0; } 55%, 75% { opacity: 1; } 85%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .cell { fill: #EDF1F6; stroke: #0B2545; } .hot { opacity: 1; } }
  </style>
  <rect width="1200" height="400" fill="#F5F7FA"/>
  <rect x="0.5" y="0.5" width="1199" height="399" fill="none" stroke="#D8DEE6"/>
